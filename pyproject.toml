[project]
name = "dogs-vs-cats"
version = "0.1.0"
description = "Dogs vs Cats with Google AutoML"
readme = "README.md"
requires-python = ">=3.15"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.md"]
authors = [{ name = "Simone Rigoni" }]
dependencies = [
    "dash-bootstrap-components>=2.0.4",
    "dash>=3.3.0",
    "google-cloud-automl>=2.16.0",
    "plotly>=5.0.0",
    "python-dotenv>=1.0.0",
]


[project.urls]
Homepage = "https://github.com/simonerigoni/dogs_vs_cats"
Repository = "https://github.com/simonerigoni/dogs_vs_cats"

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest-cov>=7.1.0",
    "ruff>=0.14.6",
]

[tool.ruff]
line-length = 100
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
# pycodestyle/pyflakes defaults plus import sorting (I), pyupgrade (UP), and flake8-bugbear (B)
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pyright]
exclude = [".venv", "**/*.ipynb"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
